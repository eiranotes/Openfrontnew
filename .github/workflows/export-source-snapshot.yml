name: Apply Fortress implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fortress-economy-responsive-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct, verify, and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .patches/fortress-ui/APPLY
          cat > /tmp/segment-checks <<'EOF'
          00abeef556f680169474eeaeeceba1056ed60d776e40b1e35d583e598d6ba18b  .patches/fortress-ui/001a.part
          728d77213a37ed4cbce77d2dc32319c2561b35d1305e4e1d3386c370843a122b  .patches/fortress-ui/001b.part
          0fc184e0f593f37315a0a4f966df365cdc5d78db2bb9c626ee184ed68ebcfb73  .patches/fortress-ui/002a.part
          baa2b93d2631d7105522003f5f37a88ca5bbfc3688f67de7b83ca1ab6d079515  .patches/fortress-ui/002b0.part
          a70d1f55e12154b2885fa526e464dc3824ddf173bcb69f22024e94ad3ece1d2b  .patches/fortress-ui/002b1.part
          580a8aeaf3ce803aa432a579cf7aba5368a00d20e45ac4fa2ada4979cd006caa  .patches/fortress-ui/003a.part
          5a74271ef688281d884ee01023af9953e6b010777b8615382a29ae7506671a1e  .patches/fortress-ui/003b.part
          EOF
          sha256sum --check --strict /tmp/segment-checks
          cat \
            .patches/fortress-ui/000.part \
            .patches/fortress-ui/001a.part \
            .patches/fortress-ui/001b.part \
            .patches/fortress-ui/002a.part \
            .patches/fortress-ui/002b0.part \
            .patches/fortress-ui/002b1.part \
            .patches/fortress-ui/003a.part \
            .patches/fortress-ui/003b.part \
            .patches/fortress-ui/004.part \
            .patches/fortress-ui/005-006.part \
            .patches/fortress-ui/007-008.part \
            .patches/fortress-ui/009.part \
            .patches/fortress-ui/010.part \
            .patches/fortress-ui/011.part \
            .patches/fortress-ui/012.part \
            .patches/fortress-ui/013.part \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/fortress-ui.patch
          echo '6350a4df99d91e0f5c365365165c3d0857666ad3ed2835ae8b7066b5b201b309  /tmp/fortress-ui.patch' \
            | sha256sum --check --strict
          git apply --check /tmp/fortress-ui.patch
          git apply /tmp/fortress-ui.patch
          rm -rf .patches/fortress-ui
          rm -f .github/workflows/apply-fortress-ui-patch.yml
          rm -f .github/workflows/export-source-snapshot.yml
          rm -f noop
          git config user.name 'openai-codex[bot]'
          git config user.email 'openai-codex[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement Fortress economy and responsive command UI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

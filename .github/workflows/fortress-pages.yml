name: Bootstrap, test, and deploy Fortress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  UPSTREAM_REPOSITORY: openfrontio/OpenFrontIO
  UPSTREAM_COMMIT: 753c66ef9463970616b17b625146b26a7154085d
  PAGES_BASE: /Openfrontnew

concurrency:
  group: fortress-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Populate the empty repository from OpenFrontIO
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .fortress-source ]]; then
            git clone "https://github.com/${UPSTREAM_REPOSITORY}.git" upstream
            git -C upstream checkout "${UPSTREAM_COMMIT}"
            rsync -a \
              --exclude='.git' \
              --exclude='.github/workflows' \
              upstream/ ./
            rm -rf upstream
            printf '%s\n' "${UPSTREAM_COMMIT}" > .fortress-source
          fi

      - name: Restore Fortress patch script
        shell: bash
        run: |
          base64 -d scripts/apply-fortress.mjs.gz.b64 | gzip -d > scripts/apply-fortress.mjs
          node --check scripts/apply-fortress.mjs

      - name: Apply Fortress balance patch
        shell: bash
        run: |
          if [[ ! -f .fortress-patched ]]; then
            node scripts/apply-fortress.mjs .
            touch .fortress-patched
          fi

      - name: Apply Fortress military HUD
        shell: bash
        run: |
          if [[ ! -f .fortress-hud ]]; then
            node --check scripts/apply-fortress-hud.mjs
            node scripts/apply-fortress-hud.mjs .
            touch .fortress-hud
          fi

      - name: Restore original single-player options and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-single-player-options.mjs .
          first_hash=$(sha256sum src/client/SinglePlayerModal.ts | cut -d' ' -f1)
          node scripts/apply-single-player-options.mjs .
          second_hash=$(sha256sum src/client/SinglePlayerModal.ts | cut -d' ' -f1)
          test "${first_hash}" = "${second_hash}"
          test "$(grep -c '^export const DEFAULT_OPTIONS = {' src/client/SinglePlayerModal.ts)" -eq 1
          ! grep -q 'export export' src/client/SinglePlayerModal.ts

      - name: Verify patch anchors
        run: |
          node scripts/verify-fortress.mjs
          node scripts/verify-fortress-hud.mjs

      - name: Commit populated and patched source tree
        shell: bash
        run: |
          set -euo pipefail
          target_branch="${GITHUB_HEAD_REF:-main}"
          git config user.name 'openai-codex[bot]'
          git config user.email 'openai-codex[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Restore configurable single-player options [skip ci]'
            git push origin "HEAD:${target_branch}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Fortress and single-player tests
        run: npx vitest run tests/FortressBalance.test.ts tests/SinglePlayerOptions.test.ts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build static single-player site
        env:
          GITHUB_PAGES: 'true'
          CDN_BASE: /Openfrontnew
          GAME_ENV: dev
          DOMAIN: localhost
          NUM_WORKERS: '2'
        run: npm run build-dev

      - name: Start configured single-player game in Chromium
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/openfront-site/Openfrontnew
          cp -a static/. /tmp/openfront-site/Openfrontnew/
          python3 -m http.server 4173 --directory /tmp/openfront-site \
            >/tmp/openfront-http.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:4173/Openfrontnew/ >/dev/null; then
              break
            fi
            sleep 1
          done
          SMOKE_SITE_URL=http://127.0.0.1:4173/Openfrontnew/ \
          SMOKE_SCREENSHOT=browser-single-player-smoke.png \
            node scripts/browser-single-player-smoke.mjs

      - name: Upload gameplay screenshot
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: browser-single-player-smoke
          path: browser-single-player-smoke.png
          if-no-files-found: ignore

      - name: Add Pages fallbacks
        run: |
          touch static/.nojekyll
          cp static/index.html static/404.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: static

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source for deployment verification
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed HTML and JavaScript bundle
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error \
              --max-time 20 "${SITE_URL}?deployment-check=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/pages-index.html; then
              success=true
              break
            fi
            sleep 3
          done
          if [[ "${success}" != "true" ]]; then
            echo "Pages index did not become available: ${SITE_URL}" >&2
            exit 1
          fi

          asset_path=$(grep -oE '/Openfrontnew/assets/index-[^" ]+\.js' \
            /tmp/pages-index.html | head -n 1 || true)
          if [[ -z "${asset_path}" ]]; then
            echo "No project-scoped application JavaScript asset found in deployed HTML" >&2
            exit 1
          fi

          origin=$(python3 - "${SITE_URL}" <<'PY'
          import sys
          from urllib.parse import urlparse
          parsed = urlparse(sys.argv[1])
          print(f"{parsed.scheme}://{parsed.netloc}")
          PY
          )
          curl --fail --location --silent --show-error --max-time 30 \
            "${origin}${asset_path}" -o /tmp/pages-app.js
          test -s /tmp/pages-app.js

          git pull --rebase origin main
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          index_bytes=$(wc -c < /tmp/pages-index.html | tr -d ' ')
          bundle_bytes=$(wc -c < /tmp/pages-app.js | tr -d ' ')
          cat > PAGES_STATUS.md <<EOF
          # GitHub Pages deployment

          - Status: verified
          - URL: ${SITE_URL}
          - Verified at: ${verified_at}
          - Source commit: ${GITHUB_SHA}
          - HTML bytes: ${index_bytes}
          - JavaScript bundle: ${asset_path} (${bundle_bytes} bytes)
          EOF

          git config user.name 'openai-codex[bot]'
          git config user.email 'openai-codex[bot]@users.noreply.github.com'
          git add PAGES_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified Pages deployment [skip ci]'
            git push origin HEAD:main
          fi

name: Apply Fortress implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fortress-economy-responsive-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Diagnose patch parts
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find .patches/fortress-ui -maxdepth 1 -name '*.part' | sort); do
            printf '%s ' "$(wc -c < "${file}")"
            sha256sum "${file}"
          done

      - name: Reconstruct, verify, and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .patches/fortress-ui/APPLY
          find .patches/fortress-ui -maxdepth 1 -name '*.part' -print0 \
            | sort -z \
            | xargs -0 cat \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/fortress-ui.patch
          echo '6350a4df99d91e0f5c365365165c3d0857666ad3ed2835ae8b7066b5b201b309  /tmp/fortress-ui.patch' \
            | sha256sum --check --strict
          git apply --check /tmp/fortress-ui.patch
          git apply /tmp/fortress-ui.patch
          rm -rf .patches/fortress-ui
          rm -f .github/workflows/apply-fortress-ui-patch.yml
          rm -f .github/workflows/export-source-snapshot.yml
          rm -f noop
          git config user.name 'openai-codex[bot]'
          git config user.email 'openai-codex[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement Fortress economy and responsive command UI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

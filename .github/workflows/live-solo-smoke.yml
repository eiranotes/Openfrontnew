name: Verify live solo options deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the repaired main deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: efa5dfdb3db120bec64f54c3756d18f53ee79494
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/workflows/fortress-pages.yml/runs?branch=main&event=push&per_page=10" \
              -o /tmp/main-runs.json

            result=$(python3 - "${EXPECTED_SHA}" <<'PY'
          import json
          import sys
          expected = sys.argv[1]
          runs = json.load(open('/tmp/main-runs.json')).get('workflow_runs', [])
          run = next((item for item in runs if item['head_sha'] == expected), None)
          if run is None:
              print('missing')
          else:
              print(f"{run['id']}|{run['status']}|{run.get('conclusion')}")
          PY
            )
            echo "Attempt ${attempt}: ${result}"
            IFS='|' read -r run_id status conclusion <<< "${result}"
            if [[ "${status:-}" == "completed" ]]; then
              if [[ "${conclusion:-}" != "success" ]]; then
                echo "Main deployment failed: run ${run_id}, conclusion ${conclusion}" >&2
                exit 1
              fi
              echo "Verified successful main deployment run ${run_id}"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for main deployment ${EXPECTED_SHA}" >&2
          exit 1

      - name: Wait for the configurable solo bundle on GitHub Pages
        shell: bash
        env:
          SITE_URL: https://eiranotes.github.io/Openfrontnew/
          EXPECTED_ASSET: /Openfrontnew/assets/index-BdLRMiFB.js
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --fail --location --silent --show-error \
              --max-time 20 "${SITE_URL}?solo-options-check=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/openfront-index.html
            live_asset=$(grep -oE '/Openfrontnew/assets/index-[^" ]+\.js' \
              /tmp/openfront-index.html | head -n 1 || true)
            echo "Attempt ${attempt}: ${live_asset:-missing}"
            if [[ "${live_asset}" == "${EXPECTED_ASSET}" ]]; then
              curl --fail --location --silent --show-error --max-time 30 \
                "https://eiranotes.github.io${live_asset}" \
                -o /tmp/openfront-app.js
              test -s /tmp/openfront-app.js
              echo "Verified deployed solo-options bundle: ${live_asset}"
              exit 0
            fi
            sleep 5
          done
          echo "Expected ${EXPECTED_ASSET}, but Pages still serves another bundle" >&2
          exit 1

name: Browser responsive single-player smoke

# UI system audit: validate the map-first command interface at desktop,
# tablet and mobile breakpoints.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, agent/project-handoff-2026-08-02]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/client/**'
      - 'src/core/game/**'
      - 'src/core/configuration/**'
      - 'src/core/execution/**'
      - 'src/core/worker/**'
      - 'resources/maps/**'
      - 'map-generator/**'
      - 'vite.config.ts'
      - 'tests/FortressBalance.test.ts'
      - 'tests/AllianceCoordination.test.ts'
      - 'tests/LandingOperations.test.ts'
      - 'tests/SinglePlayerOptions.test.ts'
      - 'tests/WorkerAssetBase.test.ts'
      - 'scripts/apply-*.mjs'
      - 'scripts/browser-single-player-smoke.mjs'
      - '.github/workflows/browser-single-player-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            width: 1440
            height: 900
          - name: tablet
            width: 1024
            height: 768
          - name: mobile
            width: 390
            height: 844

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply compact-state and alliance command updates
        run: |
          node --check scripts/apply-compact-state-combat.mjs
          node scripts/apply-responsive-mobile-fix.mjs .
          node --check scripts/apply-alliance-command.mjs
          node scripts/apply-alliance-command.mjs .
          node --check scripts/apply-alliance-command-fixes.mjs
          node scripts/apply-alliance-command-fixes.mjs .

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run configuration tests
        run: >-
          npx vitest run
          tests/FortressBalance.test.ts
          tests/AllianceCoordination.test.ts
          tests/LandingOperations.test.ts
          tests/SinglePlayerOptions.test.ts
          tests/WorkerAssetBase.test.ts

      - name: Build GitHub Pages version
        env:
          GITHUB_PAGES: 'true'
          CDN_BASE: /Openfrontnew
          GAME_ENV: dev
          DOMAIN: localhost
          NUM_WORKERS: '2'
        run: npm run build-dev

      - name: Start configured single-player game in Chromium
        shell: bash
        env:
          SMOKE_VIEWPORT_WIDTH: ${{ matrix.width }}
          SMOKE_VIEWPORT_HEIGHT: ${{ matrix.height }}
          SMOKE_ARTIFACT_PREFIX: ${{ matrix.name }}
          SMOKE_SCREENSHOT: ${{ matrix.name }}-game.png
        run: |
          set -euo pipefail
          mkdir -p /tmp/openfront-site/Openfrontnew
          cp -a static/. /tmp/openfront-site/Openfrontnew/
          python3 -m http.server 4173 --directory /tmp/openfront-site \
            >/tmp/openfront-http.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:4173/Openfrontnew/ >/dev/null; then
              break
            fi
            sleep 1
          done
          SMOKE_SITE_URL=http://127.0.0.1:4173/Openfrontnew/ \
            node scripts/browser-single-player-smoke.mjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-single-player-${{ matrix.name }}
          path: ${{ matrix.name }}-*.png
          if-no-files-found: ignore

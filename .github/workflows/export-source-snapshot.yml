name: Export source snapshot

on:
  push:
    branches:
      - agent/fortress-economy-responsive-ui
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pack repository source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=openfront-source.tar.gz HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openfront-source
          path: openfront-source.tar.gz
          if-no-files-found: error

name: Export source snapshot

on:
  push:
    branches:
      - agent/fortress-economy-responsive-ui

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pack repository source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules -czf openfront-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openfront-source
          path: openfront-source.tar.gz
          if-no-files-found: error
